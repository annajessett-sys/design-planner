<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Request Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430;
  --paper:#F3F1EC;
  --panel:#FFFFFF;
  --line:#E4E0D6;
  --line-strong:#CFC9BB;
  --teal:#2B6E62;
  --teal-dark:#1E4F46;
  --teal-tint:#E4EFEC;
  --amber:#C97A2B;
  --amber-tint:#FBEDDE;
  --red:#B5473A;
  --red-tint:#F7E4E0;
  --purple:#6E5B9E;
  --purple-tint:#EBE6F5;
  --blue:#3B6EA5;
  --blue-tint:#E4EDF5;
  --slate:#6B7280;
  --slate-tint:#EFEFEC;
  --green:#3F8F5F;
  --green-tint:#E4F1E8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp{font-family:'Sora',sans-serif;letter-spacing:-0.01em;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
#app{min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;}

/* ---------- Layout shell ---------- */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:14px 24px;background:var(--ink);color:#fff;
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif;font-weight:700;font-size:16px;white-space:nowrap;}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;}
.nav button{
  background:transparent;border:none;color:#C9CFD6;padding:8px 12px;border-radius:7px;
  font-size:13.5px;font-weight:600;white-space:nowrap;
}
.nav button.active{background:rgba(255,255,255,0.12);color:#fff;}
.nav button:hover{color:#fff;}
.searchbox{position:relative;}
.searchbox input{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);color:#fff;
  border-radius:7px;padding:7px 10px 7px 30px;font-size:13px;width:190px;
}
.searchbox input::placeholder{color:#9AA2AC;}
.searchbox svg{position:absolute;left:8px;top:8px;width:14px;height:14px;stroke:#9AA2AC;}
.userchip{font-size:12.5px;color:#C9CFD6;background:rgba(255,255,255,0.1);padding:6px 10px;border-radius:20px;white-space:nowrap;}

main{flex:1;padding:26px 28px 60px;max-width:1280px;margin:0 auto;width:100%;}

/* ---------- Buttons ---------- */
.btn{border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);
  padding:8px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--ink);}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);border-color:var(--teal-dark);}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn-danger:hover{background:#8f3a30;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--slate-tint);}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

/* ---------- Cards / panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.pagehead h1{font-size:24px;margin:0 0 4px;}
.pagehead .sub{color:var(--slate);font-size:13.5px;}
.section-title{font-size:14px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}

/* ---------- Status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}
.pill-dot{width:6px;height:6px;border-radius:50%;}

/* ---------- Event card ---------- */
.evcard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:box-shadow .12s,transform .12s;}
.evcard:hover{box-shadow:0 6px 18px rgba(27,36,48,0.08);transform:translateY(-1px);}
.evcard h3{margin:0;font-size:17px;}
.evcard .meta{color:var(--slate);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;}
.countdown{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
.countdown .n{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;line-height:1;}
.countdown .lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;opacity:.85;}
.stat-row{display:flex;gap:14px;font-size:12.5px;color:var(--slate);}
.stat-row b{color:var(--ink);font-size:13.5px;}
.progressbar{height:7px;border-radius:5px;background:var(--slate-tint);overflow:hidden;}
.progressbar > div{height:100%;background:var(--teal);}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--slate);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover td{background:var(--slate-tint);}
select.statusselect{border:1px solid var(--line-strong);border-radius:7px;padding:4px 6px;font-size:12.5px;font-weight:700;background:#fff;appearance:none;-webkit-appearance:none;}
tr.row-na td{color:var(--slate) !important;background:#F7F6F3;}
tr.row-na .pill{filter:grayscale(1);opacity:.7;}

/* ---------- Filters ---------- */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.chip{border:1px solid var(--line-strong);background:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--slate);}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.filterbar select{border:1px solid var(--line-strong);border-radius:20px;padding:5px 10px;font-size:12.5px;background:#fff;}

/* ---------- Forms / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,24,30,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
.modal.wide{max-width:760px;}
.modal h2{margin:0 0 4px;font-size:19px;}
.modal .sub{color:var(--slate);font-size:12.5px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);background:#fff;
}
.field textarea{resize:vertical;min-height:70px;}
.field .hint, .hint{font-size:11.5px;color:var(--slate);margin-top:4px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;}

/* ---------- Drawer ---------- */
.drawer-wrap{position:fixed;inset:0;background:rgba(20,24,30,0.4);z-index:90;display:flex;justify-content:flex-end;}
.drawer{background:var(--paper);width:100%;max-width:640px;height:100%;overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,0.12);}
.drawer-head{background:var(--ink);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0;z-index:5;}
.drawer-head h2{margin:0 0 2px;font-size:18px;}
.drawer-head .sub{color:#B9C6C3;font-size:12px;}
.drawer-body{padding:20px 22px;}
.drawer-close{background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:7px;width:28px;height:28px;font-size:15px;flex-shrink:0;}
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tabbar button{background:transparent;border:none;padding:9px 4px;margin-right:16px;font-size:13px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;}
.tabbar button.active{color:var(--ink);border-color:var(--teal);}
.subpanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.subpanel h4{margin:0 0 10px;font-size:13px;}

/* ---------- Sponsor chip / file row / activity ---------- */
.sponsor-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;background:#fff;}
.sponsor-chip img{width:28px;height:28px;object-fit:contain;border-radius:5px;background:var(--slate-tint);}
.sponsor-chip .logo-fallback{width:28px;height:28px;border-radius:5px;background:var(--slate-tint);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--slate);flex-shrink:0;}
.sponsor-chip .name{font-weight:600;font-size:13px;}
.sponsor-chip .lvl{font-size:11px;color:var(--slate);}
.filerow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;background:#fff;cursor:pointer;transition:box-shadow .12s,border-color .12s;}
.filerow:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(43,110,98,0.1);}
.filerow .thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;background:var(--slate-tint);flex-shrink:0;}
.filerow .name{font-size:12.5px;font-weight:600;}
.filerow .meta{font-size:11px;color:var(--slate);}
.filerow .notepreview{font-size:11.5px;color:var(--ink);background:var(--amber-tint);border-radius:6px;padding:3px 8px;margin-top:4px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.timeline{position:relative;padding-left:18px;}
.timeline::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:14px;}
.tl-item::before{content:'';position:absolute;left:-18px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
.tl-item .txt{font-size:12.5px;}
.tl-item .when{font-size:11px;color:var(--slate);}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--slate);}
.empty .big{font-size:32px;margin-bottom:6px;}
.empty h4{color:var(--ink);margin:0 0 4px;font-size:15px;}
.empty p{font-size:13px;margin:0 0 14px;}

/* ---------- toast ---------- */
#toastwrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,0.2);animation:slidein .15s ease-out;}
.toast.err{background:var(--red);}
@keyframes slidein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.icon-btn{background:transparent;border:none;color:var(--slate);padding:4px;border-radius:6px;}
.icon-btn:hover{background:var(--slate-tint);color:var(--ink);}
.templist-row{display:grid;grid-template-columns:26px 1fr 130px 110px 90px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12.5px;}
.templist-row input,.templist-row select{border:1px solid var(--line-strong);border-radius:6px;padding:5px 6px;font-size:12px;width:100%;}
.reqbox{background:#fff;border:1px dashed var(--line-strong);border-radius:10px;padding:14px;}
.reqbox textarea{width:100%;min-height:150px;border:none;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;}
.small-muted{color:var(--slate);font-size:12px;}
label.checkline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;margin-bottom:6px;}
.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:10px;color:var(--slate);font-size:13.5px;}
@media (max-width:720px){
  .field-row{grid-template-columns:1fr;}
  .templist-row{grid-template-columns:1fr;}
  .drawer{max-width:100%;}
}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Loading planner…</div></div>
<div id="toastwrap"></div>

<script type="module">
/* =========================================================================
   DESIGN REQUEST PLANNER
   Single-file app. Data persists in Firestore (shared = whole team).
   Your name is remembered locally in this browser only (localStorage).
   ========================================================================= */

/* ---------------------------------------------------------------------
   FIRESTORE SETUP — your project's config, from the Firebase console.
   --------------------------------------------------------------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC9SqJ4KJu4yvNB5vh7c0ku-aqbbfOAWKM",
  authDomain: "design-project-planner.firebaseapp.com",
  projectId: "design-project-planner",
  storageBucket: "design-project-planner.firebasestorage.app",
  messagingSenderId: "453144363375",
  appId: "1:453144363375:web:7791917cb3492b7d73a89a"
};
const fbApp = initializeApp(firebaseConfig);
const dbFs = getFirestore(fbApp);
const COLLECTION = 'designPlanner'; // one flat collection, doc id = storage key

const STATUSES = [
  {id:'not_started', label:'Not started', color:'slate'},
  {id:'ready', label:'Ready to request', color:'blue'},
  {id:'requested', label:'Requested', color:'amber'},
  {id:'in_progress', label:'In progress', color:'amber'},
  {id:'awaiting_approval', label:'Awaiting approval', color:'purple'},
  {id:'amendments_required', label:'Amendments required', color:'red'},
  {id:'re_requested', label:'Re-requested', color:'amber'},
  {id:'approved', label:'Approved', color:'teal'},
  {id:'complete', label:'Complete', color:'green'},
  {id:'na', label:'N/A', color:'slate'},
];
const AMEND_STATUSES = [
  {id:'requested', label:'Requested', color:'amber'},
  {id:'in_progress', label:'In progress', color:'amber'},
  {id:'awaiting_approval', label:'Awaiting approval', color:'purple'},
  {id:'further_amendments', label:'Further amendments required', color:'red'},
  {id:'approved', label:'Approved', color:'teal'},
  {id:'complete', label:'Complete', color:'green'},
];
const APPROVAL_OPTS = ['Awaiting review','Approved','Not approved','Amendments required','Re-requested'];

const DEFAULT_TEMPLATE_NAMES = [
"Countdown banners","Badge Paper","Lanyard","Bag","Day Planner","Registration","Sponsors Pop Up",
"Partner Pop Up","See you Next Year Pop up","Agenda Panels","Welcome to Pop Up","Meet the Buyer Pop Up",
"Lectern","GO Excellence Zone Fascia","Wall stickers","Training zone panels","Zone graphics","Video Slides",
"Presentation Slides","You are here floorplan","Keynote Graphic","Directional Pop ups",
"Partner Pavilion graphics","LED graphics - SG Conf/Live Studio","Hanging Zone Banners","Floor tiles",
"Digital signage","Catering pop-up","Media/ filming wall"
];

function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function nowIso(){ return new Date().toISOString(); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ const dt=new Date(iso); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function daysUntil(d){ if(!d) return null; const today=new Date(); today.setHours(0,0,0,0); const target=new Date(d+'T00:00:00'); return Math.round((target-today)/86400000); }
function weeksUntil(d){ const days=daysUntil(d); if(days===null) return null; return Math.floor(days/7); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusMeta(list,id){ return list.find(s=>s.id===id) || list[0]; }

function toast(msg, isErr){
  const el=document.createElement('div');
  el.className='toast'+(isErr?' err':'');
  el.textContent=msg;
  document.getElementById('toastwrap').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ---------------------------------------------------------------------
   STORAGE LAYER — Firestore, one doc per key in the "designPlanner"
   collection. The "shared" flag is kept for API compatibility but every
   key here is shared (there's no per-user auth in this build).
   --------------------------------------------------------------------- */
async function sget(key, shared){
  try{
    const snap = await getDoc(doc(dbFs, COLLECTION, key));
    return snap.exists() ? snap.data().value : null;
  } catch(e){ console.error('Firestore read failed', key, e); return null; }
}
async function sset(key, value, shared){
  try{
    await setDoc(doc(dbFs, COLLECTION, key), { value, updatedAt: Date.now() });
    return true;
  } catch(e){ console.error('Firestore write failed', key, e); toast('Save failed — check your connection or Firestore rules', true); return false; }
}
async function slist(prefix, shared){
  try{
    const snaps = await getDocs(collection(dbFs, COLLECTION));
    const keys = [];
    snaps.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
    return keys;
  } catch(e){ console.error('Firestore list failed', e); return []; }
}

const DB = {
  template: [],
  designers: ['Jamie','Seamus'],
  settings: { thresholds:{onTrack:6,keepMoving:4,attention:2}, sponsorLevels:['Headline Sponsor','Gold Sponsor','Keynote Sponsor','Zone Sponsor','Exhibitor','Partner'], mondayBoardId:'' },
  events: {},        // id -> event object
  eventOrder: [],     // array of ids, newest first
  designs: {},        // eventId -> array
  sponsors: {},        // eventId -> array
  amendments: {},        // eventId -> array
};
let currentUser = '';

async function loadAll(){
  const [tpl, desg, sett, evIndex] = await Promise.all([
    sget('template', true), sget('designers', true), sget('settings', true),
    sget('eventIndex', true)
  ]);
  DB.template = tpl ? JSON.parse(tpl) : DEFAULT_TEMPLATE_NAMES.map((n,i)=>({id:uid('tpl'),name:n,order:i,dimensions:'',designer:'',instructions:'',sponsorsCommon:false}));
  DB.designers = desg ? JSON.parse(desg) : DB.designers;
  DB.settings = sett ? JSON.parse(sett) : DB.settings;
  DB.eventOrder = evIndex ? JSON.parse(evIndex) : [];
  currentUser = localStorage.getItem('designPlannerUser') || '';

  if(!tpl) await sset('template', JSON.stringify(DB.template), true);
  if(!desg) await sset('designers', JSON.stringify(DB.designers), true);
  if(!sett) await sset('settings', JSON.stringify(DB.settings), true);

  // load events referenced by index (fallback: scan)
  let ids = DB.eventOrder;
  if(!ids.length){
    const keys = await slist('event:', true);
    ids = keys.map(k=>k.replace('event:',''));
  }
  const results = await Promise.all(ids.map(id=>sget('event:'+id, true)));
  DB.eventOrder = [];
  ids.forEach((id,i)=>{
    if(results[i]){ DB.events[id]=JSON.parse(results[i]); DB.eventOrder.push(id); }
  });
  // sort newest created first
  DB.eventOrder.sort((a,b)=> (DB.events[b].createdAt||'').localeCompare(DB.events[a].createdAt||''));

  const [designsRes, sponsorsRes, amendRes] = await Promise.all([
    Promise.all(DB.eventOrder.map(id=>sget('designs:'+id, true))),
    Promise.all(DB.eventOrder.map(id=>sget('sponsors:'+id, true))),
    Promise.all(DB.eventOrder.map(id=>sget('amendments:'+id, true))),
  ]);
  DB.eventOrder.forEach((id,i)=>{
    DB.designs[id] = designsRes[i] ? JSON.parse(designsRes[i]) : [];
    DB.sponsors[id] = sponsorsRes[i] ? JSON.parse(sponsorsRes[i]) : [];
    DB.amendments[id] = amendRes[i] ? JSON.parse(amendRes[i]) : [];
  });
}

async function saveEvent(ev){ DB.events[ev.id]=ev; await sset('event:'+ev.id, JSON.stringify(ev), true); }
async function saveEventIndex(){ await sset('eventIndex', JSON.stringify(DB.eventOrder), true); }
async function saveDesigns(eventId){ await sset('designs:'+eventId, JSON.stringify(DB.designs[eventId]||[]), true); }
async function saveSponsors(eventId){ await sset('sponsors:'+eventId, JSON.stringify(DB.sponsors[eventId]||[]), true); }
async function saveAmendments(eventId){ await sset('amendments:'+eventId, JSON.stringify(DB.amendments[eventId]||[]), true); }
async function saveTemplate(){ await sset('template', JSON.stringify(DB.template), true); }
async function saveDesigners(){ await sset('designers', JSON.stringify(DB.designers), true); }
async function saveSettings(){ await sset('settings', JSON.stringify(DB.settings), true); }

/* ---------------------------------------------------------------------
   STATE
   --------------------------------------------------------------------- */
const state = {
  page:'dashboard',        // dashboard | event | template | timeline | settings
  eventId:null,
  eventTab:'overview',     // overview | planner | sponsors | amendments | activity
  showArchived:false,
  designFilter:'all',
  designerFilter:'all',
  drawerDesignId:null,
  drawerAmendId:null,
  searchQuery:'',
  modal:null,               // {type:'newEvent'|'confirmDelete'|...}
};

function setState(patch){ Object.assign(state, patch); render(); }

/* ---------------------------------------------------------------------
   DERIVED HELPERS
   --------------------------------------------------------------------- */
function eventStats(eventId){
  const designs = (DB.designs[eventId]||[]).filter(d=>d.status!=='na');
  const total = designs.length;
  const complete = designs.filter(d=>d.status==='complete'||d.status==='approved').length;
  const outstanding = designs.filter(d=>!['complete','approved'].includes(d.status)).length;
  const notRequested = designs.filter(d=>['not_started','ready'].includes(d.status)).length;
  const awaiting = designs.filter(d=>d.status==='awaiting_approval').length;
  const amendCount = (DB.amendments[eventId]||[]).filter(a=>!['complete','approved'].includes(a.status)).length;
  const pct = total? Math.round((complete/total)*100) : 0;
  return {total,complete,outstanding,notRequested,awaiting,amendCount,pct};
}
function urgencyLevel(weeks){
  const t = DB.settings.thresholds;
  if(weeks===null) return {label:'No deadline set',cls:'slate'};
  if(weeks>=t.onTrack) return {label:'On track',cls:'teal'};
  if(weeks>=t.keepMoving) return {label:'Keep moving',cls:'blue'};
  if(weeks>=t.attention) return {label:'Attention needed',cls:'amber'};
  return {label:'Urgent',cls:'red'};
}
function colorVars(name){
  return {bg:`var(--${name}-tint, var(--slate-tint))`, fg:`var(--${name}, var(--slate))`};
}
function pillHtml(label,color){
  return `<span class="pill" style="background:var(--${color}-tint,var(--slate-tint));color:var(--${color},var(--slate));">
    <span class="pill-dot" style="background:var(--${color},var(--slate));"></span>${escapeHtml(label)}</span>`;
}

function renderTopbar(){

  ];
  return `
  <div class="topbar">

function renderPage(){
  if(state.searchQuery.trim().length>1) return renderSearchResults();
  switch(state.page){
    case 'dashboard': return renderDashboard();
    case 'event': return renderEventPage();
    case 'template': return renderTemplatePage();
    case 'timeline': return renderTimelinePage();
    case 'settings': return renderSettingsPage();
    default: return renderDashboard();
  }
}

function renderEventCard(id){
  const ev = DB.events[id];
  const stats = eventStats(id);
  const weeks = weeksUntil(ev.printDeadline);
  const days = daysUntil(ev.printDeadline);
  const urg = urgencyLevel(weeks);
  return `

    <div>
      <h3>${escapeHtml(ev.name)}</h3>
      <div class="meta">
        <span>📅 ${fmtDate(ev.date)}</span>

      </div>
    </div>
    <div class="countdown" style="background:var(--${urg.cls}-tint,var(--slate-tint));color:var(--${urg.cls},var(--slate));">

/* ---------------------------------------------------------------------
   REQUESTS TIMELINE PAGE — every requested design, across every active
   event, sorted by deadline. Drops off once approved or complete.
   --------------------------------------------------------------------- */
function renderTimelinePage(){
  const activeStatuses = ['requested','in_progress','awaiting_approval','amendments_required','re_requested'];
  let rows = [];
  DB.eventOrder.forEach(id=>{
    const ev = DB.events[id];
    if(!ev || ev.archived) return;
    (DB.designs[id]||[]).forEach(d=>{
      if(!activeStatuses.includes(d.status)) return;
      const effectiveDeadline = d.deadline || ev.printDeadline || null;
      rows.push({ev, d, effectiveDeadline});
    });
  });
  rows.sort((a,b)=>{
    if(a.effectiveDeadline && b.effectiveDeadline) return a.effectiveDeadline.localeCompare(b.effectiveDeadline);
    if(a.effectiveDeadline) return -1;
    if(b.effectiveDeadline) return 1;
    return 0;
  });
  return `
  <div class="pagehead">
    <div><h1>Requests Timeline</h1><div class="sub">Every design that's been requested, across all active events, ordered by deadline. Drops off this list once it's approved or complete.</div></div>
  </div>
  ${rows.length===0 ? renderEmpty('📋','Nothing outstanding','Once a design is marked "Requested" or later, it will show up here until it is approved.',null) : `
  <div class="card" style="padding:0;overflow-x:auto;">
  <table><thead><tr><th>Deadline</th><th>Event</th><th>Design</th><th>Status</th><th>Designer</th><th>Requested by</th><th>Requested on</th></tr></thead><tbody>
  ${rows.map(({ev,d,effectiveDeadline})=>{
    const sm = statusMeta(STATUSES, d.status);
    const days = daysUntil(effectiveDeadline);
    const urg = urgencyLevel(weeksUntil(effectiveDeadline));
    return `<tr class="rowlink" data-open-timeline="${ev.id}::${d.id}">
      <td style="color:var(--${urg.cls},var(--slate));font-weight:700;">${effectiveDeadline? fmtDate(effectiveDeadline)+' ('+(days<0?Math.abs(days)+'d overdue':days+'d')+')' : '<span class="small-muted">No deadline</span>'}</td>
      <td>${escapeHtml(ev.name)}</td>
      <td><b>${escapeHtml(d.name)}</b>${!d.deadline && ev.printDeadline?'<span class="small-muted"> · using print deadline</span>':''}</td>
      <td>${pillHtml(sm.label, sm.color)}</td>
      <td>${escapeHtml(d.designer||'—')}</td>
      <td>${escapeHtml(d.requestedBy||'—')}</td>
      <td>${d.requestedDate?fmtDateTime(d.requestedDate):'—'}</td>
    </tr>`;
  }).join('')}
  </tbody></table></div>`}
  `;
}

   --------------------------------------------------------------------- */
function renderSearchResults(){
  const q = state.searchQuery.toLowerCase();
  let results = [];
  DB.eventOrder.forEach(id=>{
    const ev = DB.events[id];
    if(ev.name.toLowerCase().includes(q)) results.push({type:'Event',label:ev.name,go:()=>{}, eventId:id});
    (DB.designs[id]||[]).forEach(d=>{
      if(d.name.toLowerCase().includes(q) || (d.notes||'').toLowerCase().includes(q)) results.push({type:'Design',label:d.name+' — '+ev.name,eventId:id,designId:d.id});
    });
    (DB.sponsors[id]||[]).forEach(s=>{
      if(s.name.toLowerCase().includes(q)) results.push({type:'Sponsor',label:s.name+' — '+ev.name,eventId:id});
    });
    (DB.amendments[id]||[]).forEach(a=>{
      if(a.title.toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q)) results.push({type:'Amendment',label:a.title+' — '+ev.name,eventId:id,amendId:a.id});
    });
  });
  return `
  <div class="pagehead"><div><h1>Search results</h1><div class="sub">${results.length} match${results.length===1?'':'es'} for "${escapeHtml(state.searchQuery)}"</div></div></div>
  ${results.length===0? renderEmpty('🔍','Nothing found','Try a different term.',null) : `
  <div class="card" style="padding:0;">
  ${results.map((r,i)=>`<div class="rowlink" style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;" data-searchresult="${i}">
    <span>${escapeHtml(r.label)}</span><span class="small-muted">${r.type}</span></div>`).join('')}
  </div>`}
  `;
}
window.__searchResultsCache = [];

/* ---------------------------------------------------------------------
   REQUEST TEXT GENERATOR
   --------------------------------------------------------------------- */
function generateRequestText(ev, d){
  const sponsorsList = (d.sponsors||[]).map(s=>{
    const sp = (DB.sponsors[ev.id]||[]).find(x=>x.id===s.sponsorId);
    if(!sp) return null;
    return s.wording ? s.wording : (sp.level ? `${sp.name} (${sp.level})` : sp.name);
  }).filter(Boolean);
  const fileNames = (d.files||[]).map(f=>f.name);
  const lines = [];
  lines.push('DESIGN REQUEST');
  lines.push('');
  lines.push(`Event: ${ev.name}`);
  lines.push(`Design: ${d.name}`);
  lines.push(`Designer: ${d.designer || 'Unassigned'}`);
  lines.push(`Deadline: ${d.deadline ? fmtDate(d.deadline) : 'Not set'}`);
  lines.push(`Dimensions: ${d.dimensions || 'Not specified'}`);
  if(d.quantity) lines.push(`Quantity: ${d.quantity}`);
  lines.push('');
  lines.push(`Sponsors: ${sponsorsList.length ? sponsorsList.join('; ') : 'None'}`);
  lines.push(`Reference files: ${fileNames.length ? fileNames.join(', ') : 'None attached'}`);
  lines.push('');
  lines.push('Instructions:');
  lines.push(d.notes ? d.notes : 'None provided.');
  return lines.join('\n');
}

      <div class="hint">Visible to the whole team next to this file.</div>
    </div>
    <div class="modal-actions"><button class="btn" data-action="close-modal">Close</button><button class="btn btn-primary" data-action="save-file-note" data-id="${f.id}">Save note</button></div>`;
  }
  return `<div class="overlay" data-close-modal>
    <div class="modal ${m.type==='filePreview'?'wide':''}" data-stop>${inner}</div>
  </div>`;
}

    if(f) setState({modal:{type:'filePreview', file:f}});

  app.querySelectorAll('[data-open-file]').forEach(el=> el.onclick = ()=>{

    const f = (d.files||[]).find(x=>x.id===el.dataset.openFile);
    if(f) setState({modal:{type:'filePreview', file:f}});
  });
  bindAction(app,'save-file-note', saveFileNote);
  bindAction(app,'record-approval', recordApproval);

function bindAction(root, name, fn){

}

/* ---------------------------------------------------------------------
   ACTION HANDLERS
   --------------------------------------------------------------------- */
async function logActivity(eventId, designId, text){
  const d = findDesign(eventId, designId);
  if(!d) return;
  d.activity = d.activity || [];
  d.activity.push({id:uid('act'), ts:nowIso(), text, by:currentUser});
  await saveDesigns(eventId);
}

async function updateDesignStatus(designId, newStatus){
  const d = findDesign(state.eventId, designId);
  const old = statusMeta(STATUSES,d.status).label;
  d.status = newStatus;
  await logActivity(state.eventId, designId, `Status changed from "${old}" to "${statusMeta(STATUSES,newStatus).label}"`);
  toast('Status updated');
  render();
}

async function updateDesignField(field, value){
  const d = findDesign(state.eventId, state.drawerDesignId);
  const old = d[field];
  d[field] = value;
  if(field==='status' && old!==value){
    await logActivity(state.eventId, d.id, `Status changed from "${statusMeta(STATUSES,old).label}" to "${statusMeta(STATUSES,value).label}"`);
  } else {
    await saveDesigns(state.eventId);
  }
  toast('Saved');
  render();
}

async function toggleDesignSponsor(sponsorId, checked){
  const d = findDesign(state.eventId, state.drawerDesignId);
  d.sponsors = d.sponsors || [];
  if(checked){ if(!d.sponsors.find(s=>s.sponsorId===sponsorId)) d.sponsors.push({sponsorId, wording:''}); }
  else { d.sponsors = d.sponsors.filter(s=>s.sponsorId!==sponsorId); }
  await saveDesigns(state.eventId);
  render();
}
async function setSponsorWording(sponsorId, wording){
  const d = findDesign(state.eventId, state.drawerDesignId);
  const s = (d.sponsors||[]).find(x=>x.sponsorId===sponsorId);
  if(s){ s.wording = wording; await saveDesigns(state.eventId); toast('Wording saved'); }
}

function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFileUpload(file){
  if(!file) return;
  if(file.size > 150*1024){ toast('Keep files under ~150KB for now — all files in this event share one Firestore document (1MB cap). Swap in Firebase Storage for real file sizes.', true); return; }
  toast('Uploading…');
  const data = await readFileAsDataUrl(file);
  const d = findDesign(state.eventId, state.drawerDesignId);
  d.files = d.files || [];
  const versionNum = d.files.length + 1;
  d.files.push({id:uid('file'), name:file.name, type:file.type, data, uploadDate:nowIso(), uploadedBy:currentUser||'Unknown', note:'', version:'v'+versionNum});
  await logActivity(state.eventId, d.id, `Uploaded file "${file.name}" (v${versionNum})`);
  toast('File uploaded');
  render();
}

async function saveFileNote(btn){
  const fileId = btn.dataset.id;
  const note = document.getElementById('filenote').value.trim();
  const d = findDesign(state.eventId, state.drawerDesignId);
  const f = (d.files||[]).find(x=>x.id===fileId);
  if(!f) return;
  const hadNote = !!f.note;
  f.note = note;
  await saveDesigns(state.eventId);
  await logActivity(state.eventId, d.id, `${hadNote?'Updated':'Added'} note on file "${f.name}"${note?': '+note:''}`);
  toast('Note saved');
  setState({modal:null});
}

async function recordApproval(){
  const decision = document.getElementById('approval-select').value;
  const note = document.getElementById('approval-note').value.trim();
  const d = findDesign(state.eventId, state.drawerDesignId);
  await logActivity(state.eventId, d.id, `Approval decision: ${decision}${note?' — '+note:''}`);
  const map = {'Approved':'approved','Amendments required':'amendments_required','Re-requested':'re_requested'};
  if(map[decision]){ d.status = map[decision]; await saveDesigns(state.eventId); }
  toast('Decision recorded');
  render();
}

async function addDesignNote(){
  const note = document.getElementById('newnote').value.trim();
  if(!note) return;
  const d = findDesign(state.eventId, state.drawerDesignId);
  await logActivity(state.eventId, d.id, `Note: ${note}`);
  toast('Note added');
  render();
}

function copyRequestText(){
  const txt = document.getElementById('requesttext').value;
  navigator.clipboard.writeText(txt).then(async ()=>{
    toast('Request copied — paste it into Monday.com');
    const d = findDesign(state.eventId, state.drawerDesignId);
    if(d){
      const wasUnrequested = ['not_started','ready'].includes(d.status);
      d.requestedBy = currentUser || d.requestedBy || 'Unknown';
      d.requestedDate = nowIso();
      if(wasUnrequested) d.status = 'requested';
      await logActivity(state.eventId, d.id, `Request copied for Monday.com${wasUnrequested?' — status set to Requested':''}`);
      await saveDesigns(state.eventId);
      render();
    }
  }).catch(()=> toast('Copy failed — select and copy manually', true));
}

async function sendToMonday(btn){
  const ev = DB.events[state.eventId];
  const d = findDesign(state.eventId, state.drawerDesignId);
  const boardId = DB.settings.mondayBoardId;
  if(!boardId){ toast('Set a Monday.com Board ID in Settings first', true); return; }
  const txt = document.getElementById('requesttext').value;
  const itemName = `${ev.name} — ${d.name}`;
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try{
    const res = await fetch('/.netlify/functions/monday-create-item', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ boardId, itemName, updateText: txt })
    });
    const data = await res.json();
    if(!res.ok || data.error){
      toast('Monday.com error: ' + (typeof data.error==='string' ? data.error : (data.error && data.error.message) || 'request failed'), true);
      return;
    }
    const wasUnrequested = ['not_started','ready'].includes(d.status);
    d.requestedBy = currentUser || d.requestedBy || 'Unknown';
    d.requestedDate = nowIso();
    d.mondayItemId = data.itemId;
    if(wasUnrequested) d.status = 'requested';
    await logActivity(state.eventId, d.id, `Sent directly to Monday.com (item ${data.itemId})${wasUnrequested?' — status set to Requested':''}`);
    await saveDesigns(state.eventId);
    toast('Created in Monday.com');
    render();
  } catch(e){
    toast('Could not reach the Monday.com function — is this deployed on Netlify with MONDAY_API_TOKEN set?', true);
  } finally {
    if(document.body.contains(btn)){ btn.disabled=false; btn.textContent=originalLabel; }
  }
}

async function submitNewEvent(){

  if(!name){ toast('Give the event a name first', true); return; }
  const id = uid('ev');
  const ev = {

    defaultDesigner: document.getElementById('f-defaultdesigner').value,
    notes: document.getElementById('f-notes').value.trim(),
    archived:false, createdAt: nowIso(),
  };
  DB.designs[id] = DB.template.map(t=>({
    id: uid('d'), name:t.name, status:'not_started', designer: t.designer||ev.defaultDesigner||'',
    dimensions:t.dimensions||'', quantity:'', deadline:'', notes:t.instructions||'', sponsors:[], files:[],
    requestedBy:'', requestedDate:'',
    activity:[{id:uid('act'),ts:nowIso(),text:'Design added from template',by:currentUser}], custom:false
  }));

  DB.amendments[id] = [];

async function duplicateEvent(){

  DB.designs[id] = (DB.designs[state.eventId]||[]).map(d=>({...d, id:uid('d'), files:[], requestedBy:'', requestedDate:'', activity:[{id:uid('act'),ts:nowIso(),text:'Duplicated from '+src.name,by:currentUser}]}));

function confirmDeleteRouter(){

async function deleteDesignConfirmed(){

function triggerLogoUpload(sponsorId){
  const input = document.createElement('input');

  input.onchange = async ()=>{
    const file = input.files[0]; if(!file) return;

    const data = await readFileAsDataUrl(file);
    const sp = (DB.sponsors[state.eventId]||[]).find(s=>s.id===sponsorId);
    sp.logo = data;
    await saveSponsors(state.eventId);
    toast('Logo uploaded');
    render();
  };

}

/* --- template --- */
async function addTemplateItem(){
  DB.template.push({id:uid('tpl'), name:'New design type', order:DB.template.length, dimensions:'', designer:'', instructions:'', sponsorsCommon:false});
  await saveTemplate();
  toast('Design type added');
  render();
}
async function updateTemplateField(id, field, value){
  const t = DB.template.find(x=>x.id===id);
  t[field]=value;
  await saveTemplate();
  toast('Template saved');
}
async function moveTemplateItem(id, dir){
  const items = [...DB.template].sort((a,b)=>a.order-b.order);
  const idx = items.findIndex(x=>x.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0||swapIdx>=items.length) return;
  const a=items[idx], b=items[swapIdx];
  const tmp=a.order; a.order=b.order; b.order=tmp;
  await saveTemplate();
  render();
}
async function deleteTemplateItem(id){
  DB.template = DB.template.filter(x=>x.id!==id);
  await saveTemplate();
  toast('Removed from template');
  render();
}

/* --- settings --- */
async function saveThresholds(){
  DB.settings.thresholds = {
    onTrack: parseInt(document.getElementById('th-ontrack').value,10)||6,
    keepMoving: parseInt(document.getElementById('th-keepmoving').value,10)||4,
    attention: parseInt(document.getElementById('th-attention').value,10)||2,
  };
  await saveSettings();
  toast('Thresholds saved');
  render();
}
async function saveMondayBoard(){
  DB.settings.mondayBoardId = document.getElementById('th-mondayboard').value.trim();
  await saveSettings();
  toast('Monday.com board ID saved');
  render();
}
async function addDesigner(){
  const v = document.getElementById('new-designer').value.trim();
  if(!v) return;
  if(!DB.designers.includes(v)) DB.designers.push(v);
  await saveDesigners();
  toast('Designer added');
  render();
}
async function removeDesigner(name){
  DB.designers = DB.designers.filter(d=>d!==name);
  await saveDesigners();
  render();
}
async function addLevel(){
  const v = document.getElementById('new-level').value.trim();
  if(!v) return;
  if(!DB.settings.sponsorLevels.includes(v)) DB.settings.sponsorLevels.push(v);
  await saveSettings();
  toast('Level added');
  render();
}
async function removeLevel(name){
  DB.settings.sponsorLevels = DB.settings.sponsorLevels.filter(l=>l!==name);
  await saveSettings();
  render();
}
async function submitUsername(){
  const v = document.getElementById('f-username').value.trim();
  currentUser = v;
  localStorage.setItem('designPlannerUser', v);
  toast('Name saved');
  setState({modal:null});
}

/* ---------------------------------------------------------------------
   INIT
   --------------------------------------------------------------------- */
(async function init(){
  await loadAll();
  render();
  if(!currentUser){
    setTimeout(()=> setState({modal:{type:'setUser'}}), 400);
  }
})();
</script>
